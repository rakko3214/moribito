services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: npm run dev --workspace=@moribito/web -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    environment:
      VITE_APP_ENV: local
      VITE_AUTH_MODE: mock
      VITE_SAVE_MODE: local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/save-api/Dockerfile
    command: npm run dev --workspace=@moribito/save-api
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
      - save_data:/data
    environment:
      APP_ENV: local
      SAVE_DATA_PATH: /data/saves.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>r.json()).then(v=>{if(v.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  web_node_modules:
  api_node_modules:
  save_data:
